<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen relative overflow-hidden flex font-body">
<!-- Top Navigation (Blurred/Dimmed Background) -->
<header class="fixed top-0 right-0 z-40 w-[calc(100%-16rem)] bg-[#fbfbe2]/70 dark:bg-stone-900/70 backdrop-blur-md text-[#553722] dark:text-stone-200 font-['Plus_Jakarta_Sans'] tracking-tight flex justify-between items-center px-8 h-20 shadow-[0_8px_32px_rgba(27,29,14,0.04)] bg-[#f5f5dc] dark:bg-stone-800 opacity-30 pointer-events-none filter blur-sm">
<div class="text-2xl font-extrabold text-[#553722] dark:text-[#f5f5dc]">
            Sensorial Brew
        </div>
<div class="flex items-center gap-6">
<button class="text-[#1b1d0e]/60 dark:text-stone-400 hover:bg-[#e4e4cc]/40 dark:hover:bg-stone-800/50 transition-all p-2 rounded-full">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="text-[#1b1d0e]/60 dark:text-stone-400 hover:bg-[#e4e4cc]/40 dark:hover:bg-stone-800/50 transition-all p-2 rounded-full">
<span class="material-symbols-outlined">settings</span>
</button>
<img alt="Admin user avatar" class="w-10 h-10 rounded-full border border-surface-container-highest" data-alt="portrait of a young woman with a warm smile, natural lighting, professional headshot" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAuIgKUK3ZIanxK9qHvYgdn7eWBKnQvrOUD49IDoxfig9FjLmWu9cK89lzjwb6eRsM0IGC717oExKsXtiq6Q3D1z_DQP6n4XsZZXhDpqcAakgq8bYT99kzpV02Rcullya613a6RZkrf2W04RAbw0hF7u4S1S02BIPhNJixhAey_tfpoJ8lt80u5nUj4UJd6FuFMBXizIlVbT-PmrimZ6DgKr4hwwDICbZgreL4chtHdS1OCuQ042ujvX55TeMK4JcQvjdLYSMSM-BQ"/>
</div>
</header>
<!-- Side Navigation (Blurred/Dimmed Background) -->
<nav class="fixed left-0 top-0 h-screen w-64 z-50 bg-[#f5f5dc] dark:bg-stone-950 text-[#553722] dark:text-[#f5f5dc] font-['Plus_Jakarta_Sans'] text-sm font-medium shadow-[12px_0_32px_rgba(27,29,14,0.03)] bg-[#e4e4cc] dark:bg-stone-800 flex flex-col h-full p-6 space-y-2 opacity-30 pointer-events-none filter blur-sm">
<div class="mb-8">
<h1 class="text-lg font-bold text-[#553722] dark:text-stone-100">Sensorial Brew</h1>
<p class="text-xs text-[#1b1d0e]/60 mt-1">Admin Dashboard</p>
</div>
<a class="text-[#1b1d0e]/70 dark:text-stone-400 py-3 px-4 flex items-center gap-3 hover:bg-[#e4e4cc]/60 dark:hover:bg-stone-900 transition-colors rounded-lg" href="#">
<span class="material-symbols-outlined">grid_view</span>
            Dashboard
        </a>
<a class="text-[#1b1d0e]/70 dark:text-stone-400 py-3 px-4 flex items-center gap-3 hover:bg-[#e4e4cc]/60 dark:hover:bg-stone-900 transition-colors rounded-lg" href="#">
<span class="material-symbols-outlined">shopping_cart</span>
            Orders
        </a>
<a class="text-[#1b1d0e]/70 dark:text-stone-400 py-3 px-4 flex items-center gap-3 hover:bg-[#e4e4cc]/60 dark:hover:bg-stone-900 transition-colors rounded-lg" href="#">
<span class="material-symbols-outlined">inventory_2</span>
            Inventory
        </a>
<a class="bg-[#e4e4cc] dark:bg-stone-800 text-[#553722] dark:text-stone-100 rounded-lg py-3 px-4 flex items-center gap-3 shadow-sm" href="#">
<span class="material-symbols-outlined">confirmation_number</span>
            Coupons
        </a>
<a class="text-[#1b1d0e]/70 dark:text-stone-400 py-3 px-4 flex items-center gap-3 hover:bg-[#e4e4cc]/60 dark:hover:bg-stone-900 transition-colors rounded-lg" href="#">
<span class="material-symbols-outlined">group</span>
            Customers
        </a>
<div class="mt-auto pt-6">
<button class="w-full text-center text-[#1b1d0e]/70 py-3 px-4 rounded-lg border border-outline-variant/20 hover:bg-[#e4e4cc]/60 transition-colors">
                View Live Shop
            </button>
</div>
</nav>
<!-- Main Content Area (Blurred/Dimmed Background) -->
<main class="ml-64 mt-20 p-8 w-full opacity-30 pointer-events-none filter blur-sm">
<div class="flex justify-between items-center mb-8">
<h2 class="text-3xl font-headline font-bold text-on-surface">Coupons</h2>
<button class="bg-gradient-to-br from-primary to-primary-container text-on-primary px-6 py-2 rounded-lg font-medium shadow-md">
                Create Coupon
            </button>
</div>
<!-- Dummy Table Content -->
<div class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_8px_32px_rgba(27,29,14,0.04)]">
<table class="w-full text-left border-collapse">
<thead>
<tr class="text-sm font-medium text-on-surface-variant border-b border-surface-container-high">
<th class="pb-4 font-headline">Code</th>
<th class="pb-4 font-headline">Type</th>
<th class="pb-4 font-headline">Value</th>
<th class="pb-4 font-headline">Status</th>
</tr>
</thead>
<tbody>
<tr class="border-b border-surface-container-high/50">
<td class="py-4 font-medium">SUMMER24</td>
<td class="py-4 text-on-surface-variant">Percentage</td>
<td class="py-4">15%</td>
<td class="py-4"><span class="bg-surface-variant text-on-surface px-3 py-1 rounded-full text-xs">Active</span></td>
</tr>
<tr>
<td class="py-4 font-medium">WELCOME10</td>
<td class="py-4 text-on-surface-variant">Fixed</td>
<td class="py-4">$10.00</td>
<td class="py-4"><span class="bg-surface-variant text-on-surface px-3 py-1 rounded-full text-xs">Active</span></td>
</tr>
</tbody>
</table>
</div>
</main>
<!-- MODAL OVERLAY -->
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-inverse-surface/40 backdrop-blur-sm p-4">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-lg rounded-xl shadow-[0_16px_64px_rgba(27,29,14,0.12)] overflow-hidden flex flex-col">
<!-- Modal Header -->
<div class="px-8 py-6 bg-surface-container-low flex justify-between items-center">
<h2 class="text-2xl font-headline font-bold text-on-surface">Create New Coupon</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body (Form) -->
<div class="px-8 py-8 flex-1 overflow-y-auto">
<form class="space-y-6">
<!-- Coupon Code -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2 font-headline" for="coupon_code">Coupon Code</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-[6px] px-4 py-3 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/10 transition-all uppercase" id="coupon_code" placeholder="e.g. COFFEE20" type="text"/>
</div>
<div class="grid grid-cols-2 gap-6">
<!-- Discount Type -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2 font-headline" for="discount_type">Discount Type</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-[6px] px-4 py-3 text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/10 transition-all" id="discount_type">
<option value="percentage">Percentage</option>
<option value="fixed">Fixed Amount</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined text-sm">expand_more</span>
</div>
</div>
</div>
<!-- Discount Value -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2 font-headline" for="discount_value">Discount Value</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-[6px] pl-4 pr-8 py-3 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/10 transition-all" id="discount_value" placeholder="0" type="number"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4 text-on-surface-variant font-medium">
                                    %
                                </div>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-6">
<!-- Usage Limit -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2 font-headline" for="usage_limit">Usage Limit</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-[6px] px-4 py-3 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/10 transition-all" id="usage_limit" placeholder="Total uses" type="number"/>
</div>
<!-- Expiry Date -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2 font-headline" for="expiry_date">Expiry Date</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-[6px] px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/10 transition-all" id="expiry_date" type="date"/>
</div>
</div>
</div>
<!-- Status -->
<div class="pt-2">
<label class="block text-sm font-medium text-on-surface mb-3 font-headline">Status</label>
<div class="flex gap-4">
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="text-primary focus:ring-primary h-4 w-4 border-outline-variant/50" name="status" type="radio" value="active"/>
<span class="text-sm text-on-surface">Active</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="text-primary focus:ring-primary h-4 w-4 border-outline-variant/50" name="status" type="radio" value="scheduled"/>
<span class="text-sm text-on-surface">Scheduled</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="text-primary focus:ring-primary h-4 w-4 border-outline-variant/50" name="status" type="radio" value="draft"/>
<span class="text-sm text-on-surface">Draft</span>
</label>
</div>
</div>
</form>
</div>
<!-- Modal Footer (Actions) -->
<div class="px-8 py-6 bg-surface-container-low flex justify-end gap-4 border-t border-outline-variant/10">
<button class="px-6 py-2.5 text-primary font-medium hover:bg-surface-variant/50 rounded-lg transition-colors font-headline text-sm">
                    Cancel
                </button>
<button class="px-6 py-2.5 bg-gradient-to-br from-primary to-primary-container text-on-primary font-medium rounded-lg shadow-sm hover:shadow-md transition-all active:scale-[0.98] font-headline text-sm">
                    Create Coupon
                </button>
</div>
</div>
</div>
</body></html>
