<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sensorial Brew - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#fbfbe2",
                        "background": "#fbfbe2",
                        "surface-variant": "#e4e4cc",
                        "secondary-fixed": "#ffddbb",
                        "primary-fixed": "#ffdcc6",
                        "outline-variant": "#d4c3ba",
                        "inverse-on-surface": "#f2f2d9",
                        "on-secondary-container": "#785e42",
                        "on-surface-variant": "#50453e",
                        "on-secondary-fixed-variant": "#5a4229",
                        "on-tertiary-fixed-variant": "#763400",
                        "on-surface": "#1b1d0e",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e4e4cc",
                        "surface-container": "#efefd7",
                        "tertiary-fixed": "#ffdbc9",
                        "inverse-surface": "#303221",
                        "on-background": "#1b1d0e",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#eabda0",
                        "on-tertiary-fixed": "#321200",
                        "on-primary-fixed": "#2d1604",
                        "surface-tint": "#79573f",
                        "on-error-container": "#93000a",
                        "secondary-container": "#fdd9b7",
                        "surface-bright": "#fbfbe2",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb68d",
                        "outline": "#82746d",
                        "tertiary": "#682d00",
                        "surface-dim": "#dbdcc3",
                        "primary": "#553722",
                        "primary-container": "#6f4e37",
                        "on-primary-fixed-variant": "#5f402a",
                        "primary-fixed-dim": "#eabda0",
                        "surface-container-low": "#f5f5dc",
                        "secondary-fixed-dim": "#e3c19f",
                        "surface-container-high": "#eaead1",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#291803",
                        "on-tertiary-container": "#ffbc96",
                        "secondary": "#735a3e",
                        "on-primary-container": "#eec1a4",
                        "tertiary-container": "#8c3f00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Be Vietnam Pro", "sans-serif"],
                        "label": ["Be Vietnam Pro", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
<!-- Decorative ambient blur for organic warmth -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0 flex justify-center items-center">
<div class="w-[800px] h-[800px] bg-primary/5 rounded-full blur-3xl translate-x-1/4 -translate-y-1/4"></div>
<div class="w-[600px] h-[600px] bg-secondary-container/20 rounded-full blur-3xl -translate-x-1/3 translate-y-1/3"></div>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest w-full max-w-[480px] p-8 md:p-12 rounded-lg shadow-[0_32px_64px_rgba(27,29,14,0.06)] relative z-10">
<!-- Brand Header -->
<div class="text-center mb-10">
<h1 class="text-3xl md:text-4xl font-headline font-extrabold text-primary tracking-tighter">Sensorial Brew</h1>
<p class="font-body text-on-surface-variant mt-2 text-sm md:text-base">Curated Rituals. Begin yours today.</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Full Name Field -->
<div class="space-y-1.5">
<label class="block text-sm font-medium text-on-surface font-label" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50" style="font-size: 20px;">person</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/20 rounded-lg text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-300 font-body" id="fullName" name="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block text-sm font-medium text-on-surface font-label" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50" style="font-size: 20px;">mail</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/20 rounded-lg text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-300 font-body" id="email" name="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="block text-sm font-medium text-on-surface font-label" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50" style="font-size: 20px;">lock</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/20 rounded-lg text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-300 font-body" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-1.5">
<label class="block text-sm font-medium text-on-surface font-label" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50" style="font-size: 20px;">lock_reset</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/20 rounded-lg text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-300 font-body" id="confirmPassword" name="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-8 bg-gradient-to-br from-primary to-primary-container text-on-primary py-3.5 rounded-lg font-headline font-semibold hover:shadow-lg hover:shadow-primary/20 hover:-translate-y-0.5 transition-all duration-300 flex justify-center items-center gap-2" type="button">
                Sign Up
                <span class="material-symbols-outlined" style="font-size: 18px; font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="font-body text-sm text-on-surface-variant">
                Already have an account? 
                <a class="font-headline font-semibold text-primary hover:text-primary-container transition-colors ml-1 border-b border-transparent hover:border-primary-container pb-0.5" href="#">Log in</a>
</p>
</div>
</div>
</body></html>
