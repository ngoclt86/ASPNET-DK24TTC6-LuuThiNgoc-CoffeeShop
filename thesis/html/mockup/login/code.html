<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - The Sensorial Brew</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-variant": "#e4e4cc",
                      "on-secondary-fixed": "#291803",
                      "on-tertiary": "#ffffff",
                      "primary-fixed": "#ffdcc6",
                      "on-primary-container": "#eec1a4",
                      "on-secondary-container": "#785e42",
                      "on-error-container": "#93000a",
                      "tertiary": "#682d00",
                      "on-primary": "#ffffff",
                      "surface-container": "#efefd7",
                      "surface": "#fbfbe2",
                      "secondary-fixed-dim": "#e3c19f",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed-dim": "#ffb68d",
                      "primary-fixed-dim": "#eabda0",
                      "surface-container-highest": "#e4e4cc",
                      "surface-dim": "#dbdcc3",
                      "on-tertiary-fixed": "#321200",
                      "outline-variant": "#d4c3ba",
                      "outline": "#82746d",
                      "on-secondary": "#ffffff",
                      "surface-tint": "#79573f",
                      "on-primary-fixed": "#2d1604",
                      "primary-container": "#6f4e37",
                      "tertiary-container": "#8c3f00",
                      "background": "#fbfbe2",
                      "on-error": "#ffffff",
                      "on-tertiary-fixed-variant": "#763400",
                      "secondary-fixed": "#ffddbb",
                      "inverse-on-surface": "#f2f2d9",
                      "inverse-surface": "#303221",
                      "on-tertiary-container": "#ffbc96",
                      "on-surface-variant": "#50453e",
                      "on-primary-fixed-variant": "#5f402a",
                      "on-background": "#1b1d0e",
                      "secondary-container": "#fdd9b7",
                      "secondary": "#735a3e",
                      "surface-bright": "#fbfbe2",
                      "error": "#ba1a1a",
                      "surface-container-high": "#eaead1",
                      "on-surface": "#1b1d0e",
                      "on-secondary-fixed-variant": "#5a4229",
                      "primary": "#553722",
                      "inverse-primary": "#eabda0",
                      "tertiary-fixed": "#ffdbc9",
                      "error-container": "#ffdad6",
                      "surface-container-low": "#f5f5dc"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Plus Jakarta Sans", "sans-serif"
                      ],
                      "body": [
                              "Be Vietnam Pro", "sans-serif"
                      ],
                      "label": [
                              "Be Vietnam Pro", "sans-serif"
                      ]
              }
            },
          },
        }
      </script>
<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
        }
      </style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-6 text-on-background antialiased selection:bg-primary selection:text-on-primary">
<main class="w-full max-w-[420px]">
<div class="text-center mb-10">
<h1 class="font-headline text-[2.5rem] font-extrabold text-primary tracking-tight leading-tight mb-2">
                The Sensorial Brew
            </h1>
<p class="font-body text-body-lg text-on-surface-variant">
                Sign in to continue your ritual.
            </p>
</div>
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_32px_64px_rgba(27,29,14,0.06)] relative overflow-hidden">
<form action="#" class="flex flex-col gap-6 relative z-10" method="POST">
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-medium text-on-surface" for="email">
                        Email Address
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px] pointer-events-none">
                            mail
                        </span>
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/40 border border-outline-variant/20 rounded-[6px] pl-10 pr-4 py-3 font-body text-base focus:outline-none focus:border-primary focus:ring-[2px] focus:ring-primary/10 transition-all duration-200" id="email" name="email" placeholder="your@email.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label text-sm font-medium text-on-surface" for="password">
                            Password
                        </label>
<a class="font-label text-sm text-tertiary hover:text-primary transition-colors focus:outline-none focus:underline" href="#">
                            Forgot Password?
                        </a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px] pointer-events-none">
                            lock
                        </span>
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/40 border border-outline-variant/20 rounded-[6px] pl-10 pr-4 py-3 font-body text-base focus:outline-none focus:border-primary focus:ring-[2px] focus:ring-primary/10 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="mt-4 w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-semibold text-lg py-3.5 px-6 rounded shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest" type="submit">
                    Login
                </button>
</form>
</div>
<div class="mt-8 text-center">
<p class="font-body text-on-surface-variant text-sm">
                Don't have an account? 
                <a class="font-headline font-semibold text-primary hover:text-primary-container transition-colors focus:outline-none focus:underline" href="#">
                    Register
                </a>
</p>
</div>
</main>
</body></html>
